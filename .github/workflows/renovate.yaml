name: Renovate

on:
  workflow_call:
  pull_request:
    paths:
      - .github/renovate-runner.json
      - .github/workflows/renovate.yaml

permissions: {}

concurrency:
  group: renovate-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.142.1-full@sha256:11fad8714c1c1a0283df4dea350299d634bd55de4aef7b752f762ed78c0ae417

jobs:
  renovate:
    name: Propose dependency updates
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      checks: read
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out shared configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scm-rs/shared-workflows
          ref: ${{ github.repository == 'scm-rs/shared-workflows' && github.sha || 'main' }}
          path: .shared-renovate
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: .shared-renovate/.github/renovate-runner.json
          renovate-image: ${{ env.RENOVATE_IMAGE }}
          token: ${{ github.token }}
          mount-docker-socket: 'false'
          docker-volumes: ''
          env-regex: '^(RENOVATE_REPOSITORIES|RENOVATE_ENDPOINT|RENOVATE_PRINT_CONFIG|LOG_LEVEL)$'
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_PRINT_CONFIG: 'false'
          LOG_LEVEL: info

  pr-check:
    name: Validate Renovate configuration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out shared configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scm-rs/shared-workflows
          ref: ${{ github.repository == 'scm-rs/shared-workflows' && github.sha || 'main' }}
          path: .shared-renovate
          persist-credentials: false
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          validator=(docker run --rm
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"
            --entrypoint renovate-config-validator "$RENOVATE_IMAGE")
          "${validator[@]}" --strict /workspace/.shared-renovate/.github/renovate-runner.json
          if [[ -f renovate.json ]]; then
            "${validator[@]}" --strict --no-global /workspace/renovate.json
          fi
